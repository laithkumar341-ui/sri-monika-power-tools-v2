<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Sri Monika Power Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #fafaf9;
            --bg-secondary: #f5f5f4;
            --text-primary: #1c1917;
            --text-secondary: #57534e;
            --accent: #ea580c;
            --accent-dark: #9a3412;
            --border: #e7e5e4;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border: 3px solid var(--text-primary);
            box-shadow: 12px 12px 0px var(--accent);
            padding: 48px;
        }

        .header {
            text-align: center;
            margin-bottom: 48px;
            padding-bottom: 24px;
            border-bottom: 3px solid var(--accent);
        }

        .logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 42px;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }

        .subtitle {
            font-family: 'Space Mono', monospace;
            color: var(--text-secondary);
            font-size: 14px;
        }

        h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 32px;
            letter-spacing: 3px;
            margin-bottom: 24px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h2::before {
            content: '//';
            color: var(--accent);
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        input, textarea {
            width: 100%;
            padding: 16px;
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            color: var(--text-primary);
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg-primary);
            box-shadow: 4px 4px 0px rgba(234, 88, 12, 0.1);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .button-group {
            display: flex;
            gap: 16px;
            margin-top: 32px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 200px;
            padding: 16px 32px;
            background: var(--accent);
            border: 3px solid var(--accent);
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Space Mono', monospace;
            clip-path: polygon(0 0, 100% 0, 100% 75%, 95% 100%, 0 100%);
        }

        button:hover {
            background: var(--accent-dark);
            transform: translateY(-2px);
            box-shadow: 6px 6px 0px var(--text-primary);
        }

        button.secondary {
            background: transparent;
            color: var(--text-primary);
            border-color: var(--text-primary);
        }

        button.secondary:hover {
            background: var(--text-primary);
            color: white;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            color: var(--text-secondary);
            text-decoration: none;
            font-family: 'Space Mono', monospace;
            font-size: 14px;
            transition: 0.3s;
        }

        .back-link:hover {
            color: var(--accent);
            transform: translateX(-4px);
        }

        .hidden { display: none; }

        .alert {
            padding: 16px;
            margin-bottom: 24px;
            border-left: 4px solid;
            font-family: 'Space Mono', monospace;
            font-size: 14px;
        }

        .alert-success {
            background: #f0fdf4;
            border-color: #22c55e;
            color: #166534;
        }

        .alert-error {
            background: #fef2f2;
            border-color: #dc2626;
            color: #991b1b;
        }

        @media (max-width: 640px) {
            .container {
                padding: 24px;
                box-shadow: 6px 6px 0px var(--accent);
            }
            .button-group { flex-direction: column; }
            button { width: 100%; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to Website
    </a>

    <div class="container">
        <div class="header">
            <div class="logo">Admin Dashboard</div>
            <div class="subtitle">Sri Monika Power Tools Management</div>
        </div>

        <!-- Login Form -->
        <div id="loginSection">
            <h2>Login</h2>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="adminEmail" placeholder="admin@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPassword" placeholder="••••••••">
            </div>
            <div class="button-group">
                <button onclick="login()">
                    <i class="fas fa-lock"></i> Login
                </button>
            </div>
        </div>

        <!-- Add Product Form -->
        <div id="dashboardSection" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <h2>Add Product</h2>
                <button onclick="logout()" class="secondary" style="min-width: auto; padding: 12px 24px; clip-path: none;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>

            <div id="alertBox"></div>

            <div class="form-group">
                <label>Product Name *</label>
                <input type="text" id="productName" placeholder="e.g., Bosch Professional Drill Machine">
            </div>

            <div class="form-group">
                <label>Category *</label>
                <input type="text" id="productCategory" placeholder="e.g., Drill Machine, Angle Grinder, Cutter">
            </div>

            <div class="form-group">
                <label>Price (₹) *</label>
                <input type="number" id="productPrice" placeholder="e.g., 4500">
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea id="productDescription" placeholder="Brief description of product features..."></textarea>
            </div>

            <div class="form-group">
                <label>Image URL *</label>
                <input type="text" id="productImageUrl" placeholder="https://example.com/image.jpg">
                <small style="color: var(--text-secondary); font-size: 12px; margin-top: 4px; display: block;">
                    Tip: Upload images to GitHub or Imgur and paste the direct link here
                </small>
            </div>

            <div class="button-group">
                <button onclick="addProduct()">
                    <i class="fas fa-plus"></i> Add Product
                </button>
                <button onclick="viewWebsite()" class="secondary">
                    <i class="fas fa-external-link-alt"></i> View Site
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC6xwCOI8p7NW9X6Zf4J0o6W1LPV73j8NQ",
            authDomain: "sri-monika-power-tools.firebaseapp.com",
            projectId: "sri-monika-power-tools",
            storageBucket: "sri-monika-power-tools.firebasestorage.app",
            messagingSenderId: "656947936561",
            appId: "1:656947936561:web:b527d9fdc7f4ad7f6c0410"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Check auth state
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
            } else {
                document.getElementById('loginSection').classList.remove('hidden');
                document.getElementById('dashboardSection').classList.add('hidden');
            }
        });

        window.login = async function() {
            const email = document.getElementById("adminEmail").value;
            const password = document.getElementById("adminPassword").value;
            
            if (!email || !password) {
                showAlert('Please enter both email and password', 'error');
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                showAlert('Login failed: ' + error.message, 'error');
            }
        };

        window.logout = async function() {
            await signOut(auth);
        };

        window.addProduct = async function() {
            const name = document.getElementById("productName").value.trim();
            const category = document.getElementById("productCategory").value.trim();
            const price = document.getElementById("productPrice").value;
            const description = document.getElementById("productDescription").value.trim();
            const imageUrl = document.getElementById("productImageUrl").value.trim();

            if (!name || !category || !price || !imageUrl) {
                showAlert('Please fill in all required fields (Name, Category, Price, Image URL)', 'error');
                return;
            }

            try {
                await addDoc(collection(db, "products"), {
                    name,
                    category,
                    price: parseFloat(price),
                    description: description || "Professional grade power tool",
                    imageUrl,
                    createdAt: new Date()
                });

                showAlert('✅ Product added successfully!', 'success');
                
                // Clear form
                document.getElementById("productName").value = "";
                document.getElementById("productCategory").value = "";
                document.getElementById("productPrice").value = "";
                document.getElementById("productDescription").value = "";
                document.getElementById("productImageUrl").value = "";
                
            } catch (error) {
                showAlert('❌ Error: ' + error.message, 'error');
            }
        };

        window.viewWebsite = function() {
            window.open('index.html', '_blank');
        };

        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => {
                alertBox.innerHTML = '';
            }, 5000);
        }
    </script>
</body>
</html>
