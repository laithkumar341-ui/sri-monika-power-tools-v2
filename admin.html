<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Sri Monika Power Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #fafaf9;
            --bg-secondary: #f5f5f4;
            --text-primary: #1c1917;
            --text-secondary: #57534e;
            --accent: #ea580c;
            --accent-dark: #9a3412;
            --border: #e7e5e4;
            --danger: #dc2626;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 48px;
            padding: 32px;
            background: white;
            border: 3px solid var(--text-primary);
            box-shadow: 12px 12px 0px var(--accent);
        }

        .logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 48px;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }

        .subtitle {
            font-family: 'Space Mono', monospace;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            color: var(--text-secondary);
            text-decoration: none;
            font-family: 'Space Mono', monospace;
            font-size: 14px;
            transition: 0.3s;
        }

        .back-link:hover {
            color: var(--accent);
            transform: translateX(-4px);
        }

        .card {
            background: white;
            border: 3px solid var(--text-primary);
            box-shadow: 8px 8px 0px rgba(0,0,0,0.1);
            padding: 32px;
            margin-bottom: 32px;
        }

        h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 32px;
            letter-spacing: 3px;
            margin-bottom: 24px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 3px solid var(--accent);
            padding-bottom: 16px;
        }

        h2::before {
            content: '//';
            color: var(--accent);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        input, textarea {
            width: 100%;
            padding: 14px;
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            color: var(--text-primary);
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg-primary);
            box-shadow: 4px 4px 0px rgba(234, 88, 12, 0.1);
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        .button-group {
            display: flex;
            gap: 16px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 150px;
            padding: 14px 28px;
            background: var(--accent);
            border: 3px solid var(--accent);
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Space Mono', monospace;
            clip-path: polygon(0 0, 100% 0, 100% 75%, 95% 100%, 0 100%);
        }

        button:hover {
            background: var(--accent-dark);
            transform: translateY(-2px);
            box-shadow: 6px 6px 0px var(--text-primary);
        }

        button.secondary {
            background: transparent;
            color: var(--text-primary);
            border-color: var(--text-primary);
        }

        button.secondary:hover {
            background: var(--text-primary);
            color: white;
        }

        button.danger {
            background: var(--danger);
            border-color: var(--danger);
            padding: 8px 16px;
            font-size: 12px;
            min-width: auto;
            clip-path: none;
        }

        button.danger:hover {
            background: #991b1b;
            box-shadow: none;
        }

        button.small {
            padding: 8px 16px;
            font-size: 12px;
            min-width: auto;
        }

        .hidden { display: none; }

        .alert {
            padding: 16px;
            margin-bottom: 24px;
            border-left: 4px solid;
            font-family: 'Space Mono', monospace;
            font-size: 14px;
        }

        .alert-success {
            background: #f0fdf4;
            border-color: #22c55e;
            color: #166534;
        }

        .alert-error {
            background: #fef2f2;
            border-color: #dc2626;
            color: #991b1b;
        }

        /* Product List Styles */
        .product-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .product-list::-webkit-scrollbar {
            width: 8px;
        }

        .product-list::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        .product-list::-webkit-scrollbar-thumb {
            background: var(--accent);
        }

        .product-item {
            display: grid;
            grid-template-columns: 60px 1fr auto auto;
            gap: 16px;
            align-items: center;
            padding: 16px;
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            transition: all 0.3s;
        }

        .product-item:hover {
            border-color: var(--accent);
            transform: translateX(4px);
        }

        .product-item img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border: 2px solid var(--text-primary);
        }

        .product-info h4 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 20px;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .product-info p {
            font-size: 13px;
            color: var(--text-secondary);
            font-family: 'Space Mono', monospace;
        }

        .product-price {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 24px;
            color: var(--accent);
        }

        .product-actions {
            display: flex;
            gap: 8px;
        }

        .loading-text {
            text-align: center;
            padding: 40px;
            font-family: 'Space Mono', monospace;
            color: var(--text-secondary);
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-box {
            background: var(--text-primary);
            color: white;
            padding: 20px;
            text-align: center;
            border: 2px solid var(--text-primary);
        }

        .stat-box h3 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 32px;
            margin-bottom: 4px;
        }

        .stat-box p {
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .stats-bar { grid-template-columns: 1fr; }
            .product-item {
                grid-template-columns: 50px 1fr;
                grid-template-rows: auto auto;
            }
            .product-price { grid-column: 2; }
            .product-actions { grid-column: 1 / -1; justify-content: flex-end; }
            .button-group { flex-direction: column; }
            button { width: 100%; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to Website
    </a>

    <div class="container">
        <div class="header">
            <div class="logo">Admin Dashboard</div>
            <div class="subtitle">Sri Monika Power Tools Management</div>
        </div>

        <!-- Login Form -->
        <div id="loginSection" class="card">
            <h2>Login</h2>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="adminEmail" placeholder="admin@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPassword" placeholder="••••••••">
            </div>
            <div class="button-group">
                <button onclick="login()">
                    <i class="fas fa-lock"></i> Login
                </button>
            </div>
        </div>

        <!-- Dashboard -->
        <div id="dashboardSection" class="hidden">
            
            <!-- Stats -->
            <div class="stats-bar">
                <div class="stat-box">
                    <h3 id="totalProducts">0</h3>
                    <p>Total Products</p>
                </div>
                <div class="stat-box">
                    <h3 id="totalValue">₹0</h3>
                    <p>Inventory Value</p>
                </div>
                <div class="stat-box">
                    <h3>Active</h3>
                    <p>Store Status</p>
                </div>
            </div>

            <!-- Add Product Form -->
            <div class="card">
                <h2>Add New Product</h2>
                <div id="alertBox"></div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>Product Name *</label>
                        <input type="text" id="productName" placeholder="e.g., Bosch Professional Drill">
                    </div>

                    <div class="form-group">
                        <label>Category *</label>
                        <input type="text" id="productCategory" placeholder="e.g., Drill Machine">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>Price (₹) *</label>
                        <input type="number" id="productPrice" placeholder="e.g., 4500">
                    </div>

                    <div class="form-group">
                        <label>Image URL *</label>
                        <input type="text" id="productImageUrl" placeholder="https://example.com/image.jpg">
                    </div>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea id="productDescription" placeholder="Brief description of product features..."></textarea>
                </div>

                <div class="button-group">
                    <button onclick="addProduct()">
                        <i class="fas fa-plus"></i> Add Product
                    </button>
                    <button onclick="viewWebsite()" class="secondary">
                        <i class="fas fa-external-link-alt"></i> View Site
                    </button>
                    <button onclick="logout()" class="secondary">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </div>

            <!-- Product List -->
            <div class="card">
                <h2>Manage Products</h2>
                <div id="productListContainer" class="product-list">
                    <div class="loading-text">Loading products...</div>
                </div>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC6xwCOI8p7NW9X6Zf4J0o6W1LPV73j8NQ",
            authDomain: "sri-monika-power-tools.firebaseapp.com",
            projectId: "sri-monika-power-tools",
            storageBucket: "sri-monika-power-tools.firebasestorage.app",
            messagingSenderId: "656947936561",
            appId: "1:656947936561:web:b527d9fdc7f4ad7f6c0410"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentProducts = [];

        // Check auth state
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                loadProductList();
            } else {
                document.getElementById('loginSection').classList.remove('hidden');
                document.getElementById('dashboardSection').classList.add('hidden');
            }
        });

        window.login = async function() {
            const email = document.getElementById("adminEmail").value;
            const password = document.getElementById("adminPassword").value;
            
            if (!email || !password) {
                showAlert('Please enter both email and password', 'error');
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                showAlert('Login failed: ' + error.message, 'error');
            }
        };

        window.logout = async function() {
            await signOut(auth);
        };

        window.addProduct = async function() {
            const name = document.getElementById("productName").value.trim();
            const category = document.getElementById("productCategory").value.trim();
            const price = document.getElementById("productPrice").value;
            const description = document.getElementById("productDescription").value.trim();
            const imageUrl = document.getElementById("productImageUrl").value.trim();

            if (!name || !category || !price || !imageUrl) {
                showAlert('Please fill in all required fields (Name, Category, Price, Image URL)', 'error');
                return;
            }

            try {
                await addDoc(collection(db, "products"), {
                    name,
                    category,
                    price: parseFloat(price),
                    description: description || "Professional grade power tool",
                    imageUrl,
                    createdAt: new Date()
                });

                showAlert('✅ Product added successfully!', 'success');
                
                // Clear form
                document.getElementById("productName").value = "";
                document.getElementById("productCategory").value = "";
                document.getElementById("productPrice").value = "";
                document.getElementById("productDescription").value = "";
                document.getElementById("productImageUrl").value = "";
                
                // Refresh list
                loadProductList();
                
            } catch (error) {
                showAlert('❌ Error: ' + error.message, 'error');
            }
        };

        window.deleteProduct = async function(productId) {
            if (!confirm('Are you sure you want to delete this product? This action cannot be undone.')) {
                return;
            }

            try {
                await deleteDoc(doc(db, "products", productId));
                showAlert('✅ Product deleted successfully!', 'success');
                loadProductList();
            } catch (error) {
                showAlert('❌ Error deleting: ' + error.message, 'error');
            }
        };

        async function loadProductList() {
            const container = document.getElementById('productListContainer');
            
            try {
                const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
                const snapshot = await getDocs(q);
                
                currentProducts = [];
                let totalValue = 0;
                
                if (snapshot.empty) {
                    container.innerHTML = '<div class="loading-text">No products added yet.</div>';
                    updateStats(0, 0);
                    return;
                }

                container.innerHTML = "";
                
                snapshot.forEach((doc) => {
                    const product = doc.data();
                    product.id = doc.id;
                    currentProducts.push(product);
                    
                    if (product.price) {
                        totalValue += parseFloat(product.price);
                    }
                    
                    const item = document.createElement('div');
                    item.className = 'product-item';
                    item.innerHTML = `
                        <img src="${product.imageUrl}" alt="${product.name}" onerror="this.src='https://via.placeholder.com/60?text=No+Image'">
                        <div class="product-info">
                            <h4>${product.name}</h4>
                            <p>${product.category}</p>
                        </div>
                        <div class="product-price">₹${product.price || '0'}</div>
                        <div class="product-actions">
                            <button class="danger" onclick="deleteProduct('${doc.id}')">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </div>
                    `;
                    
                    container.appendChild(item);
                });
                
                updateStats(currentProducts.length, totalValue);
                
            } catch (error) {
                container.innerHTML = `<div class="loading-text" style="color: red;">Error: ${error.message}</div>`;
            }
        }

        function updateStats(count, value) {
            document.getElementById('totalProducts').textContent = count;
            document.getElementById('totalValue').textContent = '₹' + value.toLocaleString('en-IN');
        }

        window.viewWebsite = function() {
            window.open('index.html', '_blank');
        };

        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => {
                alertBox.innerHTML = '';
            }, 5000);
        }
    </script>
</body>
</html>
