<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sri Monika Power Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
}

header {
  background: #111;
  color: white;
  text-align: center;
  padding: 20px;
  position: relative;
}

header a {
  position: absolute;
  right: 20px;
  top: 20px;
  color: white;
  text-decoration: none;
  font-size: 14px;
}

h2 {
  text-align: center;
  margin-top: 30px;
}

#products-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 25px;
  padding: 30px;
  max-width: 1200px;
  margin: auto;
}

.product-card {
  background: white;
  border-radius: 10px;
  padding: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  transition: 0.3s;
  text-align: center;
}

.product-card:hover {
  transform: translateY(-5px);
}

.product-card img {
  width: 100%;
  height: 200px;
  object-fit: contain;
  margin-bottom: 15px;
}

.product-card h3 {
  margin: 10px 0 5px;
}

.product-card p {
  font-size: 14px;
  color: #555;
}

.price {
  color: green;
  font-size: 18px;
  font-weight: bold;
  margin: 10px 0;
}

.order-btn {
  display: inline-block;
  background: #25D366;
  color: white;
  padding: 8px 15px;
  border-radius: 5px;
  text-decoration: none;
  font-size: 14px;
}

footer {
  background: #111;
  color: white;
  text-align: center;
  padding: 15px;
  margin-top: 40px;
}
  </style>
</head>

<body>

<header>
  <div class="admin-link">
    <a href="admin.html">Admin</a>
  </div>
  <h1>Sri Monika Power Tools</h1>
  <p>Your Trusted Tools Partner</p>
</header>

<h2>Our Products</h2>

<div class="products" id="product-list">
  <!-- Products will load here -->
</div>

<footer>
  © 2026 Sri Monika Power Tools
</footer>


<!-- Firebase + Product Loader -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC6xwCOI8p7NW9X6Zf4J0o6W1LPV73j8NQ",
  authDomain: "sri-monika-power-tools.firebaseapp.com",
  projectId: "sri-monika-power-tools",
  storageBucket: "sri-monika-power-tools.firebasestorage.app",
  messagingSenderId: "656947936561",
  appId: "1:656947936561:web:b527d9fdc7f4ad7f6c0410"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const productList = document.getElementById("product-list");

async function loadProducts() {
  const querySnapshot = await getDocs(collection(db, "products"));
  productList.innerHTML = "";

  querySnapshot.forEach((doc) => {
    const product = doc.data();

    const card = document.createElement("div");
    card.classList.add("card");

    card.innerHTML = `
      <img src="${product.image}" alt="${product.name}">
      <h3>${product.name}</h3>
      <p>${product.description}</p>
      <div class="price">₹ ${product.price}</div>
      <a class="whatsapp-btn" 
         href="https://wa.me/919344262483?text=I'm interested in ${product.name}"
         target="_blank">
         Order on WhatsApp
      </a>
    `;

    productList.appendChild(card);
  });
}

loadProducts();

</script>

</body>
</html>
