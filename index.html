<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sri Monika Power Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    .products-section {
      padding: 30px;
    }

    .products-section h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    #productsContainer {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }

    .product-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 6px;
    }

    .product-card h3 {
      margin: 10px 0 5px;
    }

    .product-card p {
      margin: 5px 0;
      font-size: 14px;
    }

    .price {
      font-weight: bold;
      color: green;
      font-size: 16px;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 40px;
    }
  </style>
</head>
<body>

<header>
  <h1>Sri Monika Power Tools</h1>
  <p>Your Trusted Tools Partner</p>
</header>

<section class="products-section">
  <h2>Our Products</h2>
  <div id="productsContainer"></div>
</section>

<footer>
  <p>© 2026 Sri Monika Power Tools</p>
</footer>

<script type="module" src="js/main.js"></script>

</body>
</html>
