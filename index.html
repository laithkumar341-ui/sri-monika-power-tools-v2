<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sri Monika Power Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f4f4;
      line-height: 1.6;
    }
    header {
      background: #1c1917;
      color: white;
      text-align: center;
      padding: 30px 20px;
      position: relative;
      border-bottom: 4px solid #ea580c;
    }
    .admin-link {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
    }
    .admin-link a {
      color: white;
      text-decoration: none;
      font-size: 14px;
      padding: 8px 16px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      transition: 0.3s;
    }
    .admin-link a:hover { background: #ea580c; }
    h1 { font-size: 2.5rem; margin-bottom: 10px; letter-spacing: 2px; }
    header p { opacity: 0.8; font-size: 1.1rem; }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    
    h2 {
      text-align: center;
      margin-bottom: 40px;
      font-size: 2rem;
      color: #1c1917;
      position: relative;
      display: inline-block;
      left: 50%;
      transform: translateX(-50%);
    }
    h2::after {
      content: '';
      display: block;
      width: 60px;
      height: 4px;
      background: #ea580c;
      margin: 10px auto 0;
    }
    
    #product-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 30px;
    }
    
    .card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      transition: all 0.3s ease;
      border: 1px solid #e5e5e5;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.15);
    }
    .card img {
      width: 100%;
      height: 220px;
      object-fit: contain;
      background: #f9f9f9;
      padding: 20px;
    }
    .card-content { padding: 20px; }
    .card h3 {
      margin: 0 0 10px 0;
      color: #1c1917;
      font-size: 1.25rem;
    }
    .category {
      display: inline-block;
      background: #f0f0f0;
      color: #666;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .card p {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 15px;
      line-height: 1.5;
    }
    .price {
      color: #ea580c;
      font-size: 1.5rem;
      font-weight: bold;
      margin: 15px 0;
    }
    .whatsapp-btn {
      display: block;
      width: 100%;
      background: #25D366;
      color: white;
      padding: 12px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      text-align: center;
      transition: 0.3s;
    }
    .whatsapp-btn:hover {
      background: #128C7E;
      transform: translateY(-2px);
    }
    
    .loading {
      text-align: center;
      padding: 60px;
      color: #999;
      font-size: 1.1rem;
      grid-column: 1 / -1;
    }
    .error {
      text-align: center;
      padding: 40px;
      color: #dc2626;
      background: #fee2e2;
      border-radius: 8px;
      grid-column: 1 / -1;
    }
    
    footer {
      background: #1c1917;
      color: white;
      text-align: center;
      padding: 30px;
      margin-top: 60px;
    }
    
    @media (max-width: 768px) {
      h1 { font-size: 1.8rem; }
      .admin-link { position: static; transform: none; margin-top: 15px; display: inline-block; }
    }
  </style>
</head>

<body>

<header>
  <h1>Sri Monika Power Tools</h1>
  <p>Your Trusted Tools Partner Since 2000</p>
  <div class="admin-link">
    <a href="admin.html">🔐 Admin Login</a>
  </div>
</header>

<div class="container">
  <h2>Our Products</h2>
  <div id="product-list">
    <div class="loading">Loading products...</div>
  </div>
</div>

<footer>
  <p>&copy; 2026 Sri Monika Power Tools. All rights reserved.</p>
  <p style="font-size: 0.9rem; opacity: 0.7; margin-top: 10px;">Contact: +91 93442 62483</p>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC6xwCOI8p7NW9X6Zf4J0o6W1LPV73j8NQ",
  authDomain: "sri-monika-power-tools.firebaseapp.com",
  projectId: "sri-monika-power-tools",
  storageBucket: "sri-monika-power-tools.firebasestorage.app",
  messagingSenderId: "656947936561",
  appId: "1:656947936561:web:b527d9fdc7f4ad7f6c0410"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const productList = document.getElementById("product-list");

async function loadProducts() {
  try {
    const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
    const querySnapshot = await getDocs(q);
    
    if (querySnapshot.empty) {
      productList.innerHTML = '<div class="error">No products available yet. Check back soon!</div>';
      return;
    }

    productList.innerHTML = "";
    
    querySnapshot.forEach((doc) => {
      const product = doc.data();
      
      const card = document.createElement("div");
      card.className = "card";
      
      // Use imageUrl (from admin) with fallback
      const imageUrl = product.imageUrl || product.image || 'https://via.placeholder.com/300x200?text=No+Image';
      const price = product.price ? `₹ ${product.price}` : 'Price on request';
      const category = product.category || 'Tools';
      const description = product.description || 'Quality power tool for professional use.';
      
      card.innerHTML = `
        <img src="${imageUrl}" alt="${product.name}" onerror="this.src='https://via.placeholder.com/300x200?text=Image+Not+Available'">
        <div class="card-content">
          <span class="category">${category}</span>
          <h3>${product.name}</h3>
          <p>${description}</p>
          <div class="price">${price}</div>
          <a class="whatsapp-btn" 
             href="https://wa.me/919344262483?text=Hi, I'm interested in ${encodeURIComponent(product.name)}. Please share more details."
             target="_blank">
             <i class="fab fa-whatsapp"></i> Order on WhatsApp
          </a>
        </div>
      `;
      
      productList.appendChild(card);
    });
  } catch (error) {
    console.error("Error loading products:", error);
    productList.innerHTML = `<div class="error">Failed to load products. Please refresh the page.<br><small>${error.message}</small></div>`;
  }
}

loadProducts();
</script>

</body>
</html>
