<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sri Monika Power Tools</title>

  <link rel="stylesheet" href="css/style.css" />
  <script defer src="js/firebase-config.js"></script>
  <script defer src="js/main.js"></script>

  <!-- Firebase CDN -->
  <script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/main.js"></script>
</head>

<body>

<header class="navbar">
  <h2>Sri Monika Power Tools</h2>
  <nav>
    <a href="#products">Products</a>
    <a href="#contact">Contact</a>
    <a href="admin.html" class="admin-link">Admin</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-content">
    <h1>Power Your Projects</h1>
    <p>Professional tools for contractors, electricians and builders.</p>
    <a href="https://wa.me/919344262483" class="btn-primary">Chat on WhatsApp</a>
  </div>
</section>

<section id="products" class="products">
  <h2>Our Products</h2>

  <div class="filter-bar">
    <button onclick="filterProducts('all')">All</button>
    <button onclick="filterProducts('Drill')">Drill</button>
    <button onclick="filterProducts('Grinder')">Grinder</button>
    <button onclick="filterProducts('Cutting')">Cutting</button>
  </div>

  <div id="productsContainer" class="product-grid">
    <!-- Dynamic products will load here -->
  </div>
</section>

<section id="contact" class="contact">
  <h2>Contact Us</h2>
  <form id="contactForm">
    <input type="text" id="name" placeholder="Your Name" required />
    <input type="text" id="phone" placeholder="Phone Number" required />
    <textarea id="message" placeholder="Message" required></textarea>
    <button type="submit" class="btn-primary">Send Message</button>
  </form>
</section>

<footer>
  <p>© 2026 Sri Monika Power Tools</p>
</footer>

</body>
</html>
